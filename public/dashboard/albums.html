<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Aestherix Albums</title>
		<link rel="icon" type="image/png" href="/favicon.png" />
		<script>
			(() => {
				const THEME_KEY = 'aestherix.dashboard.theme';
				const PALETTE_KEY = 'aestherix.dashboard.palette';
				const ZEN_CURSOR_ENABLED_KEY = 'aestherix.dashboard.cursor.enabled';
				const root = document.documentElement;

				try {
					const savedTheme = localStorage.getItem(THEME_KEY);

					if (savedTheme === 'light' || savedTheme === 'dark') {
						root.setAttribute('data-theme', savedTheme);
					} else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
						root.setAttribute('data-theme', 'light');
					}

					const savedPalette = localStorage.getItem(PALETTE_KEY);
					if (savedPalette) {
						root.setAttribute('data-palette', savedPalette);
					}
				} catch {
					if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
						root.setAttribute('data-theme', 'light');
					}
				}

				try {
					const shouldPreloadFromCache = window.sessionStorage.getItem(ZEN_CURSOR_ENABLED_KEY) === '1';

					if (shouldPreloadFromCache) {
						root.classList.add('zen-cursor-preload');
					}

					const canUseZenCursor =
						window.matchMedia &&
						window.matchMedia('(pointer: fine)').matches &&
						!window.matchMedia('(prefers-reduced-motion: reduce)').matches;

					if (canUseZenCursor) {
						root.classList.add('zen-cursor-preload');
						const preloadReleaseMs = shouldPreloadFromCache ? 3600 : 1200;

						window.addEventListener(
							'DOMContentLoaded',
							() => {
								window.setTimeout(() => {
									if (!root.classList.contains('zen-cursor-enabled')) {
										root.classList.remove('zen-cursor-preload');
									}
								}, preloadReleaseMs);
							},
							{ once: true }
						);
					} else {
						window.sessionStorage.removeItem(ZEN_CURSOR_ENABLED_KEY);
					}
				} catch {
					try {
						window.sessionStorage.removeItem(ZEN_CURSOR_ENABLED_KEY);
					} catch {
						// Ignore storage cleanup errors.
					}

					root.classList.remove('zen-cursor-preload');
				}
			})();
		</script>
		<link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css" />
		<link rel="stylesheet" href="/dashboard/styles.css" />
	</head>
	<body class="albums-page">
		<main class="albums-shell" aria-label="Profile picture albums">
			<header class="albums-head">
				<div class="albums-head-copy">
					<button id="albums-back" class="albums-back-nav" type="button" aria-label="Back to dashboard">
						<span class="nf-back-icon" aria-hidden="true">&lt;</span>
					</button>
					<h1>Albums</h1>
				</div>
			</header>
			<p id="albums-state" class="albums-state" aria-live="polite">Loading images...</p>
			<section id="albums-skeleton" class="albums-grid albums-grid-skeleton" aria-hidden="true"></section>
			<section id="albums-grid" class="albums-grid hidden" aria-label="Albums image grid"></section>
		</main>
		<div id="albums-lightbox" class="albums-lightbox hidden" role="dialog" aria-modal="true" aria-label="Image preview">
			<div id="albums-lightbox-backdrop" class="albums-lightbox-backdrop"></div>
			<div class="albums-lightbox-content" role="document">
				<div class="albums-lightbox-stage">
					<button id="albums-lightbox-prev" class="albums-lightbox-nav prev" type="button" aria-label="Previous image">
						<span class="nf-back-icon" aria-hidden="true">&lt;</span>
					</button>
					<div id="albums-lightbox-track" class="albums-lightbox-track" aria-live="polite"></div>
					<button id="albums-lightbox-next" class="albums-lightbox-nav next" type="button" aria-label="Next image">
						<span class="nf-back-icon" aria-hidden="true">&gt;</span>
					</button>
					<p id="albums-lightbox-meta" class="albums-lightbox-meta" aria-live="polite"></p>
					<div id="albums-lightbox-menu" class="albums-lightbox-menu hidden">
						<button
							id="albums-lightbox-menu-toggle"
							class="albums-lightbox-menu-toggle"
							type="button"
							aria-label="Image actions"
							aria-haspopup="true"
							aria-expanded="false"
						>
							<span class="albums-lightbox-menu-dots" aria-hidden="true">
								<span></span>
								<span></span>
								<span></span>
							</span>
						</button>
						<div id="albums-lightbox-menu-panel" class="albums-lightbox-menu-panel hidden" role="menu" aria-label="Image actions menu">
							<button id="albums-lightbox-menu-download" class="albums-lightbox-menu-item" type="button" role="menuitem">Download</button>
							<button id="albums-lightbox-menu-delete" class="albums-lightbox-menu-item danger hidden" type="button" role="menuitem">Delete</button>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script src="/socket.io/socket.io.js"></script>
		<script src="/dashboard/albums.js" type="module"></script>
	</body>
</html>
