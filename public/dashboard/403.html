<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>403 | Aestherix Dashboard</title>

		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css" />
		<link rel="stylesheet" href="/dashboard/styles.css" />

		<script>
			(() => {
				const root = document.documentElement;
				const THEME_KEY = 'aestherix.dashboard.theme';
				const PALETTE_KEY = 'aestherix.dashboard.palette';

				const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;

				try {
					const theme = localStorage.getItem(THEME_KEY);
					const palette = localStorage.getItem(PALETTE_KEY);

					root.setAttribute('data-theme', theme === 'light' || theme === 'dark' ? theme : prefersLight ? 'light' : 'dark');

					if (palette) {
						root.setAttribute('data-palette', palette);
					}
				} catch {
					root.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
				}
			})();
		</script>

		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			body.dashboard-page,
			.forbidden-page {
				min-height: 100vh;
			}

			.forbidden-page {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
			}

			.forbidden-card {
				width: min(720px, 100%);
				display: grid;
				gap: 12px;
				padding: 26px;
			}

			.forbidden-top,
			.forbidden-actions {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
			}

			.forbidden-top {
				align-items: center;
			}

			.forbidden-actions {
				margin-top: 8px;
			}

			.forbidden-code {
				margin: 0;
				font-size: clamp(62px, 13vw, 120px);
				line-height: 0.9;
				letter-spacing: 0.02em;
			}

			.forbidden-eyebrow {
				margin: 0;
				text-transform: uppercase;
				letter-spacing: 0.18em;
				font-size: 0.8rem;
				color: var(--ink-muted);
			}

			.forbidden-copy {
				margin: 0;
				font-size: 1.05rem;
				color: var(--ink-muted);
			}

			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;

				padding: 10px 16px;
				border: 1px solid var(--line);
				border-radius: 12px;

				color: var(--ink);
				text-decoration: none;
				font-weight: 600;

				background: color-mix(in srgb, var(--bg-mid) 45%, transparent);

				transition:
					transform 120ms ease,
					background-color 120ms ease,
					border-color 120ms ease;
			}

			.btn.primary {
				background: color-mix(in srgb, var(--mint) 24%, transparent);
				border-color: color-mix(in srgb, var(--mint) 56%, transparent);
			}

			.btn:hover,
			.btn:focus-visible {
				transform: translateY(-1px);
				border-color: color-mix(in srgb, var(--sky) 55%, transparent);
				background: color-mix(in srgb, var(--sky) 20%, transparent);
			}
		</style>
	</head>
	<body class="dashboard-page">
		<div class="app-bg"></div>
		<main class="dashboard forbidden-page" role="main" aria-labelledby="page-title">
			<section class="panel forbidden-card">
				<p class="forbidden-eyebrow">Access Blocked</p>
				<div class="forbidden-top">
					<h1 id="page-title" class="forbidden-code">403</h1>
					<div>
						<p class="hero-version">Owner access required.</p>
						<p class="forbidden-copy">This editor is locked to owner sessions only.</p>
					</div>
				</div>
				<div class="forbidden-actions">
					<a class="btn primary" href="/dashboard">Back to Dashboard</a>
				</div>
			</section>
		</main>
		<script src="/dashboard/build/zen-cursor.js" type="module"></script>
	</body>
</html>
