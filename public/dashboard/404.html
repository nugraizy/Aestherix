<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>404 | Aestherix Dashboard</title>

		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css" />
		<link rel="stylesheet" href="/dashboard/styles.css" />

		<script>
			(() => {
				const root = document.documentElement;
				const THEME_KEY = 'aestherix.dashboard.theme';
				const PALETTE_KEY = 'aestherix.dashboard.palette';

				const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;

				try {
					const theme = localStorage.getItem(THEME_KEY);
					const palette = localStorage.getItem(PALETTE_KEY);

					root.setAttribute('data-theme', theme === 'light' || theme === 'dark' ? theme : prefersLight ? 'light' : 'dark');

					if (palette) {
						root.setAttribute('data-palette', palette);
					}
				} catch {
					root.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
				}
			})();
		</script>

		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			body.dashboard-page,
			.not-found-page {
				min-height: 100vh;
			}

			.not-found-page {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
			}

			.not-found-card {
				width: min(720px, 100%);
				display: grid;
				gap: 12px;
				padding: 26px;
			}

			.not-found-top,
			.not-found-actions {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
			}

			.not-found-top {
				align-items: center;
			}

			.not-found-actions {
				margin-top: 8px;
			}

			.not-found-code {
				margin: 0;
				font-size: clamp(62px, 13vw, 120px);
				line-height: 0.9;
				letter-spacing: 0.02em;
				font-weight: 900;
				color: transparent;

				background-image: linear-gradient(
					120deg,
					var(--brand-wave-1) 0%,
					var(--brand-wave-2) 12.5%,
					var(--brand-wave-3) 25%,
					var(--brand-wave-4) 37.5%,
					var(--brand-wave-1) 50%,
					var(--brand-wave-2) 62.5%,
					var(--brand-wave-3) 75%,
					var(--brand-wave-4) 87.5%,
					var(--brand-wave-1) 100%
				);

				background-size: 200% 100%;
				background-position: center;
				background-clip: text;
				-webkit-background-clip: text;

				-webkit-text-stroke: 1px color-mix(in srgb, var(--sky) 28%, transparent);
				text-shadow: 0 0 26px color-mix(in srgb, var(--sky) 30%, transparent);

				animation: hero-brand-shimmer 5.6s linear infinite;
			}

			.not-found-title {
				margin: 2px 0 0;
				font-size: 24px;
				font-weight: 200;
				letter-spacing: 0.01em;
			}

			.not-found-btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;

				padding: 10px 16px;
				border: 1px solid var(--line);
				border-radius: 12px;

				color: var(--ink);
				text-decoration: none;
				font-weight: 600;

				background: color-mix(in srgb, var(--bg-mid) 45%, transparent);

				transition:
					transform 120ms ease,
					background-color 120ms ease,
					border-color 120ms ease;
			}

			.not-found-btn.primary {
				background: color-mix(in srgb, var(--mint) 24%, transparent);
				border-color: color-mix(in srgb, var(--mint) 56%, transparent);
			}

			.not-found-btn:hover,
			.not-found-btn:focus-visible {
				transform: translateY(-1px);
				border-color: color-mix(in srgb, var(--sky) 55%, transparent);
				background: color-mix(in srgb, var(--sky) 20%, transparent);
			}
		</style>
	</head>

	<body class="dashboard-page">
		<div class="app-bg"></div>

		<main class="dashboard not-found-page" role="main" aria-labelledby="page-title">
			<section class="panel not-found-card">
				<div class="not-found-top">
					<p class="not-found-code" aria-hidden="true">404</p>
				</div>

				<h1 id="page-title" class="not-found-title">Page not found</h1>

				<div class="not-found-actions">
					<a class="not-found-btn primary" href="/dashboard"> Dashboard </a>
				</div>
			</section>
		</main>
	</body>
</html>
